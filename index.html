<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101126"><title>Math Duel — live math challenge</title>
  <style>
    :root{color-scheme:dark;--bg:#101126;--panel:#1b1c37;--line:#343654;--ink:#f6f4ff;--muted:#a5a6c4;--a:#b9a4ff;--b:#78ebce;--warn:#ffcf7e;--bad:#ff8d9a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#35305a 0,transparent 42%),var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 18px;background:var(--a);color:#17142a;font-weight:750;transition:transform .15s,filter .15s}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.ghost{background:#292a49;color:var(--ink);border:1px solid var(--line)}.shell{max-width:780px;margin:auto;padding:24px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin:3px 0 32px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.03em;font-size:18px}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--b));color:#15152c}.connection{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:var(--b)}.dot.off{background:var(--bad)}main{min-height:65vh;display:grid;place-items:center}.card{width:min(100%,620px);background:linear-gradient(155deg,rgba(32,33,63,.96),rgba(24,25,48,.96));border:1px solid var(--line);border-radius:25px;padding:clamp(22px,5vw,42px);box-shadow:0 24px 80px #05050f55}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--b)}h1{font-size:clamp(32px,6vw,52px);line-height:1.05;letter-spacing:-.055em;margin:12px 0}h2{font-size:26px;letter-spacing:-.035em;margin:8px 0 16px}.sub{color:var(--muted);max-width:46ch}.field{display:flex;flex-direction:column;gap:7px;margin:18px 0}.field label{font-size:13px;color:#d3d1e8;font-weight:700}.field input{border:1px solid #424363;border-radius:12px;padding:13px 14px;background:#13142a;color:var(--ink);outline:none}.field input:focus{border-color:var(--a);box-shadow:0 0 0 3px #b9a4ff22}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions>*{flex:1}.muted{color:var(--muted);font-size:14px}.roomline{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin:16px 0;background:#14152d}.code{font-weight:900;letter-spacing:.18em;font-size:19px}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.player{border:1px solid var(--line);border-radius:14px;padding:14px;background:#14152d}.player strong{display:block}.player small{color:var(--muted)}.badge{display:inline-flex;padding:3px 9px;border-radius:999px;background:#292a49;color:var(--muted);font-size:12px;font-weight:700}.badge.you{background:#313057;color:var(--a)}.scorebar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:22px}.score{font-size:13px;color:var(--muted)}.score b{color:var(--ink);font-size:16px}.turn{padding:11px 14px;border-radius:12px;background:#292a49;margin-bottom:20px;font-weight:720}.numbers{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:20px 0}.num{display:grid;place-items:center;min-width:52px;height:52px;border-radius:14px;background:#292a49;border:1px solid #424363;font-size:20px;font-weight:850}.targetbox{text-align:center;margin:8px 0 16px}.targetbox small{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:800}.target{font-size:clamp(48px,12vw,74px);font-weight:900;line-height:1;letter-spacing:-.06em;color:var(--b);margin:6px}.timer{font-variant-numeric:tabular-nums;font-size:24px;font-weight:850;text-align:center;margin:10px 0;color:var(--warn)}.timer.urgent{color:var(--bad);animation:pulse .8s infinite alternate}@keyframes pulse{to{opacity:.6}}.expression{width:100%;border:1px solid #424363;border-radius:12px;padding:14px;background:#13142a;color:var(--ink);outline:none;font-size:18px}.notice{margin:12px 0;color:var(--muted);font-size:13px}.notice.error{color:var(--bad)}.notice.good{color:var(--b)}.bigresult{text-align:center;padding:16px}.bigresult .emoji{font-size:52px}.bigresult h2{font-size:34px}.divider{height:1px;background:var(--line);margin:20px 0}.hint{font-size:12px;color:var(--muted);margin-top:24px;text-align:center}.hidden{display:none!important}.rps{display:flex;gap:10px;margin:20px 0}.rps button{font-size:16px;background:#292a49;border:1px solid #454667;color:var(--ink)}footer{text-align:center;color:#777997;font-size:12px;margin-top:22px}
    @media(max-width:480px){.top{margin-bottom:22px}.card{border-radius:20px}.row{flex-direction:column}.row>*{width:100%}.player{padding:11px}.actions{flex-direction:column}.scorebar{align-items:flex-start}}
  </style>
</head>
<body><div class="shell">
  <header class="top"><div class="brand"><span class="mark">±</span> MATH DUEL</div><div class="connection"><span id="dot" class="dot"></span><span id="conn">Ready</span></div></header>
  <main><section id="view" class="card"></section></main>
  <footer>Two devices · Three rounds · 100 seconds each</footer>
</div>
<script>
(()=>{
 const view=document.querySelector('#view'),dot=document.querySelector('#dot'),conn=document.querySelector('#conn');
 const storedId=localStorage.getItem('mathduel-id')||crypto.randomUUID();localStorage.setItem('mathduel-id',storedId);
 let ws,room=null,myId=storedId,name='',code='',notice='',submitted=false,lastRps=null,tick=null;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const send=(action,extra={})=>{if(ws?.readyState===1)ws.send(JSON.stringify({action,...extra}))};
 const connect=(creating)=>{
   name=document.querySelector('#name').value.trim()||'Player'; localStorage.setItem('mathduel-name',name);
   code=(document.querySelector('#code')?.value||'').trim().toUpperCase();
   const scheme=location.protocol==='https:'?'wss:':'ws:'; ws=new WebSocket(`${scheme}//${location.host}/ws`);
   conn.textContent='Connecting…';dot.classList.add('off');
   ws.onopen=()=>send('join',{create:creating,code,name,id:myId});
   ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='error'){notice=m.message;render()}if(m.type==='joined'){myId=m.id;code=m.code;notice='';history.replaceState(null,'',`/${code}`)}if(m.type==='state'){room=m.room;submitted=false;notice='';render()}};
   ws.onclose=()=>{dot.classList.add('off');conn.textContent='Disconnected';};ws.onerror=()=>{notice='Could not connect. Refresh to try again.';render()};
 };
 function landing(){view.innerHTML=`<div class="eyebrow">A little friendly competition</div><h1>Think fast.<br>Play together.</h1><p class="sub">Challenge someone on another device. Solve the numbers before the clock runs out.</p><div class="field"><label for="name">Your name</label><input id="name" maxlength="18" placeholder="e.g. Alex" value="${esc(localStorage.getItem('mathduel-name')||'')}" autocomplete="nickname"></div><div class="actions"><button id="create">Create a room</button></div><div class="divider"></div><div class="field"><label for="code">Have a room code?</label><div class="row"><input id="code" maxlength="6" placeholder="ENTER CODE" autocomplete="off"><button id="join" class="ghost">Join room</button></div></div><p class="notice ${notice?'error':''}">${esc(notice)}</p>`;
 document.querySelector('#create').onclick=()=>connect(true);document.querySelector('#join').onclick=()=>connect(false);document.querySelector('#code').onkeydown=e=>{if(e.key==='Enter')connect(false)};}
 function active(){if(!room)return null;return room.players.find(p=>p.id===room.current)}
 function isMyTurn(){return active()?.id===myId}
 function shell(content){view.innerHTML=content;conn.textContent='Live room';dot.classList.remove('off')}
 function header(){const players=room.players||[];return `<div class="roomline"><div><div class="muted">ROOM CODE</div><div class="code">${esc(room.code)}</div></div><button class="ghost" id="copy">Copy invite</button></div><div class="players">${[0,1].map(i=>{const p=players[i];return `<div class="player"><strong>${p?esc(p.name):'Waiting for player…'} ${p?.id===myId?'<span class="badge you">YOU</span>':''}</strong><small>${p?`${room.score[p.id]||0} point${room.score[p.id]===1?'':'s'}`:'Share the invite link'}</small></div>`}).join('')}</div>`}
 function wireCopy(){document.querySelector('#copy')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);notice='Invite link copied!';render()}catch{notice='Copy the room code from the top of the page.';render()}})}
 function render(){if(!room){landing();return}wireCopy();
   if(room.phase==='lobby'){
    shell(`<div class="eyebrow">Room lobby</div><h2>Waiting for your rival</h2><p class="sub">Send this room link to another player. You both join from your own devices.</p>${header()}${room.players.length===2?`<div class="actions"><button id="start" ${room.players[0].id!==myId?'disabled':''}>Start Rock Paper Scissors</button></div><p class="notice">${room.players[0].id===myId?'Both players are here. Ready?':'Waiting for the room host to start.'}</p>`:''}`);wireCopy();document.querySelector('#start')?.addEventListener('click',()=>send('start'));return;
   }
   if(room.phase==='rps'){
    const did=lastRps!==null&&room.rpsResult!=='tie';
    shell(`<div class="eyebrow">Step 1 · Who goes first?</div><h2>Rock Paper Scissors</h2><p class="sub">Choose at the same time. The winner gets the first math turn. Ties replay.</p>${header()}<div class="rps">${[['rock','✊ Rock'],['paper','✋ Paper'],['scissors','✌️ Scissors']].map(([v,l])=>`<button data-rps="${v}" ${did?'disabled':''}>${l}</button>`).join('')}</div><p class="notice">${room.rpsResult?esc(room.rpsResult):did?'Choice locked in — waiting for your opponent…':'Pick one to lock in your choice.'}</p>`);wireCopy();document.querySelectorAll('[data-rps]').forEach(b=>b.onclick=()=>{lastRps=b.dataset.rps;send('rps',{choice:lastRps});render()});return;
   }
   if(room.phase==='ready'){
    shell(`<div class="eyebrow">Step 2 · Three math rounds</div><h2>${esc(room.players.find(p=>p.id===room.first)?.name)} goes first</h2><p class="sub">Before each round, the player whose turn it is picks their starting number. Then the game adds three numbers from 1 to 10 and creates a reachable target.</p>${header()}<div class="actions"><button id="begin" ${room.first!==myId?'disabled':''}>Begin Round 1</button></div><p class="notice">${room.first===myId?'The first puzzle is ready when you are.':'Waiting for the first player to begin.'}</p>`);wireCopy();document.querySelector('#begin')?.addEventListener('click',()=>send('begin'));return;
   }
   if(room.phase==='pick'){
    const p=active(),mine=isMyTurn();
    shell(`<div class="scorebar"><span class="badge">ROUND ${room.round} OF 3</span><span class="score">${esc(room.players[0].name)} <b>${room.score[room.players[0].id]||0}</b> — <b>${room.score[room.players[1].id]||0}</b> ${esc(room.players[1].name)}</span></div><div class="turn">${mine?'Your turn':`${esc(p?.name)}’s turn`}</div><h2>Choose your starting number</h2><p class="sub">Pick any whole number from −999 to 999. Your 100-second timer starts after the puzzle appears.</p>${mine?`<form id="picknum"><div class="field"><label for="startnum">Starting number</label><input class="expression" id="startnum" type="number" min="-999" max="999" step="1" value="${Math.floor(Math.random()*19)+2}" required></div><button>Generate my puzzle</button></form>`:`<p class="notice">Waiting for ${esc(p?.name)} to choose a starting number…</p>`}`);document.querySelector('#picknum')?.addEventListener('submit',e=>{e.preventDefault();send('choose_number',{number:document.querySelector('#startnum').value})});return;
   }
   if(room.phase==='math'){
    const p=active(),mine=isMyTurn(),remaining=Math.max(0,Math.ceil(room.deadline-Date.now()/1000));
    shell(`<div class="scorebar"><span class="badge">ROUND ${room.round} OF 3</span><span class="score">${esc(room.players[0].name)} <b>${room.score[room.players[0].id]||0}</b> — <b>${room.score[room.players[1].id]||0}</b> ${esc(room.players[1].name)}</span></div><div class="turn">${mine?'Your turn':`${esc(p.name)}’s turn`}</div><div class="numbers">${room.numbers.map(n=>`<span class="num">${n}</span>`).join('')}</div><div class="targetbox"><small>Target</small><div class="target">${room.target}</div></div><div class="timer ${remaining<=15?'urgent':''}" id="timer">${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}</div>${mine?`<form id="answer"><div class="field"><label for="expr">Your expression · use every number once</label><input class="expression" id="expr" maxlength="120" placeholder="( 8 × 7 ) + 3 − 2" autocomplete="off" ${submitted?'disabled':''}></div><button ${submitted?'disabled':''}>Submit answer</button></form><p class="notice">${esc(notice||'Only integer divisions are allowed.')}</p>`:`<p class="notice">Watch the timer while your opponent solves the puzzle.</p>`}`);if(mine)document.querySelector('#answer').onsubmit=e=>{e.preventDefault();submitted=true;send('submit',{expression:document.querySelector('#expr').value});render()};return;
   }
   if(room.phase==='result'){
    const res=room.lastResult,own=res?.id===myId;
    shell(`<div class="scorebar"><span class="badge">ROUND ${room.round} OF 3 · COMPLETE</span><span class="score">${esc(room.players[0].name)} <b>${room.score[room.players[0].id]||0}</b> — <b>${room.score[room.players[1].id]||0}</b> ${esc(room.players[1].name)}</span></div><div class="bigresult"><div class="emoji">${res?.hit?'🎯':'⏱️'}</div><h2>${res?.hit?'Target reached!':res?.timeout?'Time’s up':'No point this round'}</h2><p class="sub">${res?.hit?`${esc(res.name)} scored a point with ${esc(res.expression)}.`:res?.timeout?`${esc(res.name)} ran out of time. Neither player scores.`:`${esc(res.name)}’s answer was incorrect. Neither player scores.`}</p></div><div class="roomline"><span>Current score</span><strong>${esc(room.players[0].name)} ${room.score[room.players[0].id]||0} — ${room.score[room.players[1].id]||0} ${esc(room.players[1].name)}</strong></div><div class="actions"><button id="next" ${own?'':'disabled'}>${room.round===3?'See final result':'Start next round'}</button></div><p class="notice">${own?'Ready when you are.':`Waiting for ${esc(res?.name)} to continue.`}</p>`);document.querySelector('#next')?.addEventListener('click',()=>send(room.round===3?'finish':'next'));return;
   }
   if(room.phase==='finished'){
    const [a,b]=room.players,sa=room.score[a.id]||0,sb=room.score[b.id]||0,w=sa===sb?null:sa>sb?a:b;
    shell(`<div class="eyebrow">Game complete · 3 rounds</div><div class="bigresult"><div class="emoji">${w?'🏆':'🤝'}</div><h2>${w?`${esc(w.name)} wins!`:'It’s a draw!'}</h2><p class="sub">${esc(a.name)} scored ${sa}; ${esc(b.name)} scored ${sb}.</p></div><div class="actions"><button id="again">Play another game</button><button id="copyfinal" class="ghost">Copy room invite</button></div>`);document.querySelector('#again').onclick=()=>{room=null;ws?.close();notice='';landing()};document.querySelector('#copyfinal').onclick=async()=>{await navigator.clipboard.writeText(location.href);notice='Invite copied!'};return;
   }
 }
 const parts=location.pathname.split('/').filter(Boolean);if(parts.length && !location.hash){code=parts[0].toUpperCase();history.replaceState(null,'','/');const n=localStorage.getItem('mathduel-name')||'Player';const sock=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws`);ws=sock;sock.onopen=()=>sock.send(JSON.stringify({action:'join',code,name:n,id:myId}));sock.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='error'){notice=m.message;room=null;render()}if(m.type==='joined'){code=m.code}if(m.type==='state'){room=m.room;render()}};sock.onclose=()=>{dot.classList.add('off');conn.textContent='Disconnected'}}else landing();
 setInterval(()=>{if(room?.phase==='math'){const el=document.querySelector('#timer');if(el){const n=Math.max(0,Math.ceil(room.deadline-Date.now()/1000));el.textContent=`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;el.classList.toggle('urgent',n<=15)}}},200);
})();
</script></body></html>
